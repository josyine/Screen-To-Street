<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen To Street — Location submissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260904">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
a{text-decoration:none;}
/* style.css met `overflow:hidden` + `display:flex` sur body pour la mise en page
   plein-écran de map.html — sans cette redéfinition explicite, la page ne défile pas du
   tout (impossible de swiper vers le bas pour voir la liste des lieux en attente). Même
   correctif que settings.html. */
body{background:#E7E9EC;padding:0;min-height:100vh;height:auto;display:block;overflow-x:hidden;overflow-y:auto;}
.hidden{display:none !important;}

.top-bar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-size:16px;font-weight:700;color:#2E3644;}
.brand span{color:#D42759;}
.back-link{color:#D42759;font-weight:700;font-size:13px;}
.back-link:hover{text-decoration:underline;}

.page{max-width:820px;margin:0 auto;padding:32px 20px 80px;}
h1{font-size:22px;color:#212832;margin-bottom:6px;}
.submissions-count{font-size:16px;font-weight:600;color:#D42759;}
.sub{font-size:13px;color:#64748b;margin-bottom:28px;}

.state-box{background:#fff;border:1px solid #ECE7F3;border-radius:16px;padding:40px;text-align:center;color:#64748b;font-size:14px;}
.state-box.denied{border-color:#FBD5DC;background:#FFF7F8;color:#D42759;font-weight:600;}

.submission-card{background:#fff;border:1px solid #ECE7F3;border-radius:16px;padding:22px 24px;margin-bottom:18px;}
.sub-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.sub-name{font-size:16.5px;font-weight:700;color:#212832;}
.sub-badge{display:inline-block;margin-top:4px;background:#FCE7F0;color:#D42759;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;}
.sub-edit-tag{background:#EFF6FF;color:#2563eb;}
.sub-meta{font-size:12px;color:#64748b;margin-bottom:12px;}
.sub-photo-preview{margin-bottom:8px;border-radius:10px;overflow:hidden;}
.sub-photo-preview img{display:block;width:100%;max-height:220px;object-fit:cover;}
.sub-photo-missing{background:#FFF7F8;border:1px dashed #FBD5DC;border-radius:10px;padding:14px;text-align:center;color:#D42759;font-size:12px;font-weight:600;}
.sub-photo-input,.sub-tweet-input,.sub-video-input,.sub-social-input{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:12px;font-family:'Poppins',sans-serif;margin-bottom:4px;}
.sub-photo-hint{font-size:10.5px;color:#94a3b8;margin-bottom:12px;line-height:1.4;}
.sub-tweet-preview{margin-bottom:8px;}
.sub-story{font-size:13px;color:#334155;line-height:1.6;background:#faf9fc;border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.sub-story p{margin-bottom:8px;}
.sub-story p:last-child{margin-bottom:0;}
.sub-fields{font-size:11.5px;color:#94a3b8;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;}
.sub-source{font-size:12px;margin-bottom:16px;}
.sub-source a{color:#D42759;font-weight:600;word-break:break-all;}
.sub-actions{display:flex;gap:10px;}
.btn-approve{flex:1;background:#10b981;color:#fff;border:none;border-radius:100px;padding:11px;font-size:13px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;}
.btn-approve:hover{filter:brightness(0.95);}
.btn-reject{flex:1;background:#fff;color:#ef4444;border:1.5px solid #FBD5DC;border-radius:100px;padding:11px;font-size:13px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;}
.btn-reject:hover{background:#fef2f2;}
.btn-approve:disabled, .btn-reject:disabled{opacity:0.5;cursor:not-allowed;}
.sub-result{font-size:12px;font-weight:600;margin-top:8px;}
.sub-result.ok{color:#10b981;}
.sub-result.err{color:#ef4444;}
</style>
</head>
<body>

<div class="top-bar">
    <div class="brand">Screen To Street <span>· Admin</span></div>
    <a href="map.html" class="back-link">← Back to Map</a>
</div>

<div class="page">
    <h1>Location submissions <span id="submissions-count" class="submissions-count hidden"></span></h1>
    <p class="sub">New locations and corrections proposed for review — nothing here is visible on the site until approved.</p>

    <div id="loading-state" class="state-box">Checking access…</div>
    <div id="denied-state" class="state-box denied hidden">You don't have admin access to this page.</div>
    <div id="empty-state" class="state-box hidden">No pending submissions right now.</div>
    <div id="submissions-list"></div>
</div>

<script type="module" src="firebase-init.js?v=20260904"></script>
<script src="countries.js?v=20260904"></script>
<script src="script.js?v=20260904"></script>
<script>
    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    function storyHtml(sub) {
        const en = sub.fullDescription && sub.fullDescription.en;
        return en || '<em>No story text provided.</em>';
    }

    // Une IA peut fournir une URL de photo qui n'existe pas réellement (hallucination) —
    // plutôt qu'une icône d'image cassée silencieuse, on remplace par un message explicite
    // pour que ce soit visible pendant la relecture, avant d'approuver.
    function handleSubPhotoError(imgEl) {
        const wrapper = imgEl.closest('.sub-photo-preview');
        if (wrapper) wrapper.innerHTML = '<div class="sub-photo-missing">⚠ Photo URL provided but failed to load — verify or replace the URL below before approving.</div>';
    }

    function photoPreviewHtml(url) {
        return url
            ? `<img src="${escapeHtml(url)}" alt="" loading="lazy" onerror="handleSubPhotoError(this)">`
            : `<div class="sub-photo-missing">No photo provided — paste a URL below before approving.</div>`;
    }

    // Extrait l'id d'une vidéo YouTube depuis n'importe quelle forme d'URL usuelle
    // (watch?v=, youtu.be/, /embed/, /shorts/) — avant ce correctif, il n'y avait aucun
    // champ pour saisir une vidéo dans cet écran : coller l'URL dans "Photo URL" échouait
    // silencieusement (ni vignette dans le header du lieu, ni vidéo affichée), puisque ni
    // <img> ni `ytId` n'étaient jamais réellement renseignés.
    function extractYouTubeId(url) {
        const s = (url || '').trim();
        if (!s) return null;
        const m = s.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
        return m ? m[1] : (/^[a-zA-Z0-9_-]{10,15}$/.test(s) ? s : null);
    }

    // Reconnaît un lien vers un post Twitter/X (peu importe le domaine historique ou
    // actuel) — utilisé pour proposer un embed réel plutôt que de tenter de le charger
    // comme une image, ce qui échouait toujours (ce n'est pas une image).
    function extractTweetUrl(url) {
        const s = (url || '').trim();
        return /^https?:\/\/(www\.)?(twitter|x)\.com\/[^/]+\/status\/\d+/.test(s) ? s : null;
    }

    // Instagram/Facebook/TikTok (demande du 06/09/2026, en plus du champ Twitter/X) :
    // pas d'embed ici (contrairement au tweet), juste un lien "Follow" cliquable sur la
    // fiche du lieu — valide seulement le domaine, pour éviter d'y coller une image ou
    // une URL d'un autre site par erreur.
    function extractInstagramUrl(url) {
        const s = (url || '').trim();
        return /^https?:\/\/(www\.)?instagram\.com\/.+/.test(s) ? s : null;
    }
    function extractFacebookUrl(url) {
        const s = (url || '').trim();
        return /^https?:\/\/(www\.)?facebook\.com\/.+/.test(s) ? s : null;
    }
    function extractTikTokUrl(url) {
        const s = (url || '').trim();
        return /^https?:\/\/(www\.)?tiktok\.com\/.+/.test(s) ? s : null;
    }

    let twitterWidgetLoading = null;
    function loadTwitterWidgetScript() {
        if (window.twttr && window.twttr.widgets) return Promise.resolve();
        if (twitterWidgetLoading) return twitterWidgetLoading;
        twitterWidgetLoading = new Promise((resolve) => {
            const s = document.createElement('script');
            s.src = 'https://platform.twitter.com/widgets.js';
            s.onload = resolve;
            s.onerror = resolve;
            document.body.appendChild(s);
        });
        return twitterWidgetLoading;
    }
    async function renderTweetEmbed(container, tweetUrl) {
        container.innerHTML = `<blockquote class="twitter-tweet"><a href="${escapeHtml(tweetUrl)}"></a></blockquote>`;
        await loadTwitterWidgetScript();
        if (window.twttr && window.twttr.widgets) window.twttr.widgets.load(container);
    }

    function renderCard(sub) {
        const isEdit = !!sub.matchedLocId;
        const practicalCount = Array.isArray(sub.practicalInfo) ? sub.practicalInfo.length : 0;
        const tipsCount = Array.isArray(sub.tipsList) ? sub.tipsList.length : 0;
        const submittedAt = sub.submittedAt && sub.submittedAt.toDate ? sub.submittedAt.toDate().toLocaleString() : '';

        const card = document.createElement('div');
        card.className = 'submission-card';
        card.innerHTML = `
            <div class="sub-header">
                <div>
                    <div class="sub-name">${escapeHtml(sub.name || '(no name)')}</div>
                    <span class="sub-badge ${isEdit ? 'sub-edit-tag' : ''}">${isEdit ? 'Correction to existing location #' + escapeHtml(sub.matchedLocId) : 'New location'}</span>
                </div>
            </div>
            <div class="sub-meta">${escapeHtml(sub.group || '')} · ${escapeHtml(sub.member || '')} &middot; ${escapeHtml(sub.city || '')}, ${escapeHtml(sub.country || '')} &middot; ${escapeHtml(sub.category || '')} &middot; ${escapeHtml(sub.year || '')}</div>
            <div class="sub-photo-preview">${photoPreviewHtml(sub.img)}</div>
            <input type="url" class="sub-photo-input" placeholder="Photo URL" value="${escapeHtml(sub.img || '')}">
            <div class="sub-photo-hint">Tip: right-click a photo on the artist's official Instagram/X/Weverse post → "Copy image address", then paste it here. Approving publishes exactly this URL. (A YouTube link or a Twitter/X post link goes in the fields below instead — pasting one here won't work.)</div>

            <div class="sub-tweet-preview hidden"></div>
            <input type="url" class="sub-tweet-input" placeholder="Tweet / X post URL (optional)" value="${escapeHtml(sub.tweetUrl || '')}">
            <div class="sub-tweet-error hidden" style="font-size:10.5px;color:#D42759;margin-bottom:8px;">Doesn't look like a twitter.com/x.com status URL.</div>

            <input type="url" class="sub-social-input" data-platform="instagram" placeholder="Instagram URL (optional)" value="${escapeHtml(sub.instagramUrl || '')}">
            <div class="sub-social-error hidden" data-platform="instagram" style="font-size:10.5px;color:#D42759;margin-bottom:8px;">Doesn't look like an instagram.com URL.</div>
            <input type="url" class="sub-social-input" data-platform="facebook" placeholder="Facebook URL (optional)" value="${escapeHtml(sub.facebookUrl || '')}">
            <div class="sub-social-error hidden" data-platform="facebook" style="font-size:10.5px;color:#D42759;margin-bottom:8px;">Doesn't look like a facebook.com URL.</div>
            <input type="url" class="sub-social-input" data-platform="tiktok" placeholder="TikTok URL (optional)" value="${escapeHtml(sub.tiktokUrl || '')}">
            <div class="sub-social-error hidden" data-platform="tiktok" style="font-size:10.5px;color:#D42759;margin-bottom:8px;">Doesn't look like a tiktok.com URL.</div>

            <input type="url" class="sub-video-input" placeholder="YouTube video URL (optional)" value="${sub.ytId ? 'https://www.youtube.com/watch?v=' + escapeHtml(sub.ytId) : ''}">
            <div class="sub-video-hint" style="font-size:10.5px;color:#94a3b8;margin-bottom:12px;">If the photo field above is empty, the video's thumbnail is used automatically for the location's header image.</div>

            <div class="sub-story">${storyHtml(sub)}</div>
            <div class="sub-fields">
                <span>${practicalCount} practical info item${practicalCount === 1 ? '' : 's'}</span>
                <span>${tipsCount} tip${tipsCount === 1 ? '' : 's'}</span>
                <span class="sub-video-status">${sub.ytId ? 'YouTube video: ' + escapeHtml(sub.ytId) : 'No YouTube video'}</span>
                <span>lat/lng: ${sub.lat != null ? sub.lat : '—'}, ${sub.lng != null ? sub.lng : '—'}</span>
            </div>
            <div class="sub-source">
                <b>Source:</b> ${sub.episodeLink ? `<a href="${escapeHtml(sub.episodeLink)}" target="_blank" rel="noopener">${escapeHtml(sub.episodeLink)}</a>` : '<em>none provided</em>'}
                ${sub.sourceNote ? `<br><span style="color:#64748b;">${escapeHtml(sub.sourceNote)}</span>` : ''}
                <br><span style="color:#94a3b8;">Submitted by ${escapeHtml(sub.submittedBy || 'unknown')}${submittedAt ? ' — ' + submittedAt : ''}</span>
            </div>
            <div class="sub-actions">
                <button class="btn-approve">✓ Approve &amp; publish</button>
                <button class="btn-reject">✕ Reject</button>
            </div>
            <div class="sub-result hidden"></div>
        `;

        const resultEl = card.querySelector('.sub-result');
        const approveBtn = card.querySelector('.btn-approve');
        const rejectBtn = card.querySelector('.btn-reject');
        const photoInput = card.querySelector('.sub-photo-input');
        const photoPreview = card.querySelector('.sub-photo-preview');
        const tweetInput = card.querySelector('.sub-tweet-input');
        const tweetPreview = card.querySelector('.sub-tweet-preview');
        const tweetError = card.querySelector('.sub-tweet-error');
        const videoInput = card.querySelector('.sub-video-input');
        const videoStatus = card.querySelector('.sub-video-status');

        // Modifie directement `sub` (fermé par les callbacks d'approbation/rejet ci-dessous) :
        // approuver publie donc la valeur éditée ici, pas la proposition d'origine de l'IA.
        if (photoInput) {
            photoInput.addEventListener('change', () => {
                const val = photoInput.value.trim();
                // Un lien Twitter/X collé ici (par erreur, "Photo URL" n'accepte que des
                // images) est automatiquement redirigé vers le bon champ ci-dessous plutôt
                // que d'échouer silencieusement comme avant ce correctif — voir la demande
                // du 06/09/2026 (post Museum SAN).
                const asTweet = extractTweetUrl(val);
                if (asTweet) {
                    photoInput.value = '';
                    sub.img = '';
                    photoPreview.innerHTML = photoPreviewHtml(sub.img);
                    tweetInput.value = asTweet;
                    tweetInput.dispatchEvent(new Event('change'));
                    return;
                }
                sub.img = val;
                photoPreview.innerHTML = photoPreviewHtml(sub.img);
            });
        }

        if (tweetInput) {
            const refreshTweet = async () => {
                const val = tweetInput.value.trim();
                if (!val) { sub.tweetUrl = ''; tweetPreview.classList.add('hidden'); tweetError.classList.add('hidden'); return; }
                const clean = extractTweetUrl(val);
                if (!clean) { tweetError.classList.remove('hidden'); tweetPreview.classList.add('hidden'); return; }
                tweetError.classList.add('hidden');
                sub.tweetUrl = clean;
                tweetPreview.classList.remove('hidden');
                await renderTweetEmbed(tweetPreview, clean);
            };
            tweetInput.addEventListener('change', refreshTweet);
            if (sub.tweetUrl) refreshTweet();
        }

        // Instagram/Facebook/TikTok : mêmes trois champs, aucun embed (voir plus haut),
        // juste une validation de domaine avant d'accepter la valeur dans `sub`.
        const socialConfig = {
            instagram: { extract: extractInstagramUrl, field: 'instagramUrl' },
            facebook: { extract: extractFacebookUrl, field: 'facebookUrl' },
            tiktok: { extract: extractTikTokUrl, field: 'tiktokUrl' }
        };
        card.querySelectorAll('.sub-social-input').forEach(input => {
            const platform = input.dataset.platform;
            const cfg = socialConfig[platform];
            const errorEl = card.querySelector(`.sub-social-error[data-platform="${platform}"]`);
            if (!cfg || !errorEl) return;
            input.addEventListener('change', () => {
                const val = input.value.trim();
                if (!val) { sub[cfg.field] = ''; errorEl.classList.add('hidden'); return; }
                const clean = cfg.extract(val);
                if (!clean) { errorEl.classList.remove('hidden'); return; }
                errorEl.classList.add('hidden');
                sub[cfg.field] = clean;
            });
        });

        if (videoInput) {
            videoInput.addEventListener('change', () => {
                const val = videoInput.value.trim();
                if (!val) { sub.ytId = ''; videoStatus.textContent = 'No YouTube video'; return; }
                const id = extractYouTubeId(val);
                if (!id) { videoStatus.textContent = "Doesn't look like a YouTube URL"; return; }
                sub.ytId = id;
                videoStatus.textContent = 'YouTube video: ' + id;
                // Vignette automatique dans le header du lieu si aucune photo n'a été
                // fournie par ailleurs — sans ce correctif, un lieu avec une vidéo mais
                // sans "Photo URL" n'affichait aucune image nulle part.
                if (!photoInput.value.trim()) {
                    const thumbUrl = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
                    photoInput.value = thumbUrl;
                    sub.img = thumbUrl;
                    photoPreview.innerHTML = photoPreviewHtml(sub.img);
                }
            });
        }

        approveBtn.onclick = async () => {
            approveBtn.disabled = true; rejectBtn.disabled = true;
            const res = await window.approveLocationSubmission(sub);
            resultEl.classList.remove('hidden');
            if (res.success) {
                resultEl.textContent = '✓ Published as ' + res.publishedId + '. It will appear on the map for visitors from their next page load.';
                resultEl.className = 'sub-result ok';
                setTimeout(() => card.remove(), 2500);
            } else {
                resultEl.textContent = 'Failed: ' + res.code;
                resultEl.className = 'sub-result err';
                approveBtn.disabled = false; rejectBtn.disabled = false;
            }
        };

        rejectBtn.onclick = async () => {
            const note = prompt('Optional note (why is this rejected?)') || '';
            approveBtn.disabled = true; rejectBtn.disabled = true;
            const res = await window.rejectLocationSubmission(sub.id, note);
            resultEl.classList.remove('hidden');
            if (res.success) {
                resultEl.textContent = 'Rejected.';
                resultEl.className = 'sub-result ok';
                setTimeout(() => card.remove(), 1500);
            } else {
                resultEl.textContent = 'Failed: ' + res.code;
                resultEl.className = 'sub-result err';
                approveBtn.disabled = false; rejectBtn.disabled = false;
            }
        };

        return card;
    }

    async function loadSubmissions() {
        const listEl = document.getElementById('submissions-list');
        // Pas de limite ici : window.listPendingSubmissions() (firebase-init.js) interroge
        // Firestore sans `limit()`, donc TOUTES les soumissions en attente sont déjà
        // chargées, quel que soit leur nombre — seul ce compteur manquait pour le voir.
        const submissions = await window.listPendingSubmissions();
        listEl.innerHTML = '';
        document.getElementById('empty-state').classList.toggle('hidden', submissions.length > 0);
        const countEl = document.getElementById('submissions-count');
        if (countEl) {
            countEl.textContent = submissions.length > 0 ? `(${submissions.length})` : '';
            countEl.classList.toggle('hidden', submissions.length === 0);
        }
        submissions.forEach(sub => listEl.appendChild(renderCard(sub)));
    }

    window.addEventListener('firebase-ready', async (e) => {
        const user = e.detail && e.detail.user;
        const loadingEl = document.getElementById('loading-state');
        const deniedEl = document.getElementById('denied-state');
        if (!user) {
            loadingEl.classList.add('hidden');
            deniedEl.classList.remove('hidden');
            return;
        }
        const isAdmin = typeof window.isCurrentUserAdmin === 'function' && await window.isCurrentUserAdmin();
        loadingEl.classList.add('hidden');
        if (!isAdmin) {
            deniedEl.classList.remove('hidden');
            return;
        }
        await loadSubmissions();
    });
</script>
</body>
</html>
