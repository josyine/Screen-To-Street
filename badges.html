<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
/* Ecran de chargement (demande du 07/10/2026, "affiche cet ecran de chargement que lors
   de l'ouverture du site") : le globe plein ecran (.stsl) ne s'affiche qu'une fois par
   session (sessionStorage, voir le script juste apres <body>) - une navigation interne
   suivante affiche a la place ce loader "simple" (.page-loader-simple, repris a
   l'identique de l'ancienne version a 3 points), plus leger et qui ne telecharge jamais
   page-loader.js (inutilement lourd pour une page qui ne va pas montrer le globe). CSS
   inline juste apres la balise viewport, avant tout <link> externe, pour s'afficher des
   le tout premier rendu quel que soit celui des deux choisi. */
.page-loader-simple{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#F5F3FC,#E3DEF5,#D8CFF0,#E3DEF5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .4s ease}
.page-loader-simple.hidden{display:none}
.page-loader-simple.page-loader-hidden{opacity:0;pointer-events:none}
.page-loader-pin{width:44px;height:44px}
.page-loader-dots{display:flex;gap:9px}
.page-loader-dot{width:10px;height:10px;border-radius:50%;background:#D42759;animation:pageLoaderBounce 1.1s ease-in-out infinite}
.page-loader-dot:nth-child(2){background:#B9A8DA;animation-delay:.15s}
.page-loader-dot:nth-child(3){background:#D42759;opacity:.65;animation-delay:.3s}
@keyframes pageLoaderBounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-10px);opacity:1}}

:root{--stsl-mag:#D42759;--stsl-ink:#212832;--stsl-soft:#6B6478}
.stsl{position:fixed;inset:0;z-index:99999;overflow:hidden;background:linear-gradient(135deg,#F5F3FC,#E3DEF5 45%,#D8CFF0 75%,#E3DEF5);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Poppins',system-ui,sans-serif;transition:opacity .75s ease}
.stsl.hidden{display:none}
.stsl.out{opacity:0;pointer-events:none}
.stsl-word{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12vh);left:0;right:0;text-align:center;font-weight:700;font-size:22px;color:var(--stsl-ink);letter-spacing:-.01em;animation:stslUp .6s both;transition:opacity .25s}
.stsl-word b{color:var(--stsl-mag)}
.stsl-stage{position:relative;width:var(--d, 220px);height:var(--d, 220px);will-change:transform,filter;transition:transform 1.3s cubic-bezier(.3,0,.1,1),filter 1.3s cubic-bezier(.3,0,.1,1)}
.stsl-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stsl-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);transition:opacity .25s}
.stsl-ring circle{fill:none}
.stsl-ring .bg{stroke:rgba(255,255,255,.75)}
.stsl-ring .f{stroke:var(--stsl-mag);stroke-linecap:round}
.stsl-info{margin-top:28px;text-align:center;transition:opacity .25s}
.stsl-pct{font-size:30px;font-weight:700;color:var(--stsl-ink);line-height:1}
.stsl-pct small{font-size:15px;color:var(--stsl-soft)}
.stsl-step{margin-top:10px;font-size:13.5px;font-weight:500;color:var(--stsl-soft);min-height:20px}
.stsl-step.flip{animation:stslUp .35s both}
.stsl.diving .stsl-ring,.stsl.diving .stsl-info,.stsl.diving .stsl-word{opacity:0}
.stsl.diving .stsl-stage{transform:scale(18);filter:blur(14px)}
@keyframes stslUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .stsl *{animation:none!important}
  .stsl-stage{transition:opacity .3s ease!important}
  .stsl.diving .stsl-stage{transform:none!important;filter:none!important;opacity:0}
}
</style>
<title>Screen To Street — My badges</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screen To Street">
<meta name="theme-color" content="#F7F5FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260996" onload="try{sessionStorage.removeItem('cssReloadAttempted');}catch(e){}" onerror="try{if(!sessionStorage.getItem('cssReloadAttempted')){sessionStorage.setItem('cssReloadAttempted','1');location.reload();}}catch(e){}">
<style>
/* BUG rapporté le 08/10/2026 ("ça ne va pas la page badge... reprends la page html que
   je t'ai envoyé pour mobile") : cette page réutilisait jusqu'ici le gabarit générique
   des pages secondaires (grande carte blanche centrée + header du site avec logo/icônes,
   voir visited.html) — remplacé par la mise en page plein écran de la maquette fournie :
   bord à bord, barre du haut collante (retour/titre/fermer) + onglets segmentés
   directement sous elle, sans le header universel du site (pas de place pour lui dans
   cette maquette, et cette page est de toute façon un sous-écran de la carte, pas une
   section du menu profil comme visited.html/wishlist.html). */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;}
body{background:#F7F5FB;min-height:100vh;overflow-x:hidden;}
.hidden{display:none!important;}
</style>
<script>
    if (!sessionStorage.getItem('bgSyncTime')) { sessionStorage.setItem('bgSyncTime', Date.now()); }
    document.documentElement.style.setProperty('--sync-t', ((Date.now() - parseInt(sessionStorage.getItem('bgSyncTime'))) / 1000) + 's');
</script>
</head>
<body>
<!-- Ecran de chargement (demande du 07/10/2026) : le globe (.stsl) ne s'affiche qu'une
     fois par session (premiere page vue, voir sessionStorage dans le script juste en
     dessous) - toute navigation interne suivante affiche a la place le loader "simple"
     (.page-loader-simple, repris de l'ancienne version a 3 points) sans jamais charger
     page-loader.js, inutilement lourd pour une page qui ne va pas montrer le globe. -->
<div class="page-loader-simple hidden" id="pageLoaderSimple">
    <svg class="page-loader-pin" viewBox="0 0 400 400">
      <path d="M200,50 C148,50 106,92 106,146 C106,220 200,340 200,340 C200,340 294,220 294,146 C294,92 252,50 200,50 Z" fill="#2E3644"/>
      <circle cx="200" cy="150" r="26" fill="#D42759"/>
    </svg>
    <div class="page-loader-dots">
        <span class="page-loader-dot"></span>
        <span class="page-loader-dot"></span>
        <span class="page-loader-dot"></span>
    </div>
</div>
<div class="stsl hidden" id="stsl" role="progressbar" aria-label="Chargement de Screen To Street" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="stsl-word">Screen To <b>Street</b></div>
  <div class="stsl-stage" id="stslStage">
    <canvas id="stslGlobe"></canvas>
    <svg class="stsl-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="48" stroke-width="1.6"/><circle class="f" id="stslRing" cx="50" cy="50" r="48" stroke-width="1.6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
  </div>
  <div class="stsl-info"><div class="stsl-pct"><span id="stslPct">0</span><small> %</small></div><div class="stsl-step" id="stslStep">On cherche les lieux de tes idols…</div></div>
</div>
<script>
(function () {
    var isFirstLoad = true;
    try {
        isFirstLoad = !sessionStorage.getItem('stslSeen');
        if (isFirstLoad) sessionStorage.setItem('stslSeen', '1');
    } catch (e) { /* stockage indisponible (navigation privee tres restrictive...) : on considere que c'est la premiere fois */ }
    if (isFirstLoad) {
        document.getElementById('stsl').classList.remove('hidden');
        var s = document.createElement('script');
        s.src = 'page-loader.js?v=20260996';
        document.currentScript.insertAdjacentElement('afterend', s);
    } else {
        var simple = document.getElementById('pageLoaderSimple');
        simple.classList.remove('hidden');
        var hidden = false;
        function hideSimple() {
            if (hidden) return;
            hidden = true;
            simple.classList.add('page-loader-hidden');
            setTimeout(function () { simple.remove(); }, 450);
        }
        window.addEventListener('load', hideSimple);
        setTimeout(hideSimple, 8000);
    }
})();
</script>

<!-- Barre du haut + onglets (même structure que la maquette fournie : .stb-top/.stb-bar/
     .stb-seg, voir le commentaire CSS plus haut) — "Retour"/"Fermer" renvoient tous les
     deux vers map.html (vrais liens, voir window.initBadgesPage()/renderBadgesTab()/
     renderRankTab() dans script.js pour le contenu des deux onglets ci-dessous). -->
<div class="badges-page-top">
    <div class="badges-page-bar">
        <a href="map.html" class="badges-page-iconbtn" id="badges-back-btn" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        </a>
        <h2 id="badges-page-title">My badges</h2>
        <a href="map.html" class="badges-page-iconbtn" id="badges-close-btn" style="background:#F1EEF6;border:0;" aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </a>
    </div>
    <div class="badges-page-tabs" id="badges-page-tabs" role="tablist">
        <button type="button" role="tab" data-tab="badges" aria-selected="true" id="badges-page-tab-badges-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l-2 6M16 3l2 6"></path><circle cx="12" cy="14.5" r="6"></circle></svg>
            <span id="badges-page-tab-badges-label">Badges</span>
        </button>
        <button type="button" role="tab" data-tab="rank" aria-selected="false" id="badges-page-tab-rank-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"></path></svg>
            <span id="badges-page-tab-rank-label">Leaderboard</span>
        </button>
    </div>
</div>
<div class="badges-page-body">
    <div class="badges-tab on" id="badges-tab-badges" role="tabpanel"></div>
    <div class="badges-tab" id="badges-tab-rank" role="tabpanel"></div>
</div>

<!-- Fiche détail d'un badge (tiroir du bas, rempli par showBadgeDetail() dans
     script.js) -->
<div class="badges-dim" id="badges-dim"></div>
<div class="badges-detail" id="badges-detail" role="dialog" aria-modal="true"></div>

<script type="module" src="firebase-init.js?v=20260996"></script>
<script src="locations-data.js?v=20260996"></script>
<script src="script.js?v=20260996"></script>
<script>
    // Textes bilingues de la page (même convention `isFr` que window.initBadgesPage() /
    // renderBadgesTab() / renderRankTab() dans script.js, pas le dictionnaire data-i18n
    // à 8 langues — cette page n'a pas de sélecteur de langue propre, voir le commentaire
    // CSS plus haut, elle reprend juste la langue déjà choisie ailleurs sur le site).
    function applyBadgesPageTexts() {
        const isFr = currentLang === 'fr';
        document.getElementById('badges-back-btn').setAttribute('aria-label', isFr ? 'Retour' : 'Back');
        document.getElementById('badges-close-btn').setAttribute('aria-label', isFr ? 'Fermer' : 'Close');
        document.getElementById('badges-page-title').textContent = isFr ? 'Mes badges' : 'My badges';
        document.getElementById('badges-page-tab-badges-label').textContent = 'Badges';
        document.getElementById('badges-page-tab-rank-label').textContent = isFr ? 'Classement' : 'Leaderboard';
    }
    applyBadgesPageTexts();

    if (typeof window.initBadgesPage === 'function') window.initBadgesPage();
</script>
</body>
</html>
