<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
a{text-decoration:none;}
body{background:#E7E9EC;padding:0; min-height:100vh; overflow-x:hidden;}
.hidden { display: none !important; }

/* FOND ANIMÉ (identique à profile.html/friends.html) */
.hero-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; background: linear-gradient(135deg, #F5F3FC, #E3DEF5, #D8CFF0, #E3DEF5); background-size: 200% 200%; animation: gradientShift 10s ease infinite; }
@keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; animation: float 12s infinite ease-in-out alternate; }
.blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: #e3d5f8; }
.blob-2 { bottom: -10%; right: -10%; width: 35vw; height: 35vw; background: #fce7f0; animation-delay: -4s; }
.blob-3 { top: 40%; left: 60%; width: 25vw; height: 25vw; background: #d9cdee; animation-delay: -8s; }
@keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(30px) scale(1.05); } }
.hero-background { animation-delay: calc(0s - var(--sync-t, 0s)) !important; }

/* Header desktop, identique aux autres pages (voir profile.html) — masqué sur mobile
   globalement (voir style.css), où #mobile-top-icons/.mobile-bottom-nav (injectées par
   script.js) prennent le relais. */
.universal-logo { position: fixed; top: 25px; left: 20px; z-index: 2500; display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
.brand-text { font-size: 19px; font-weight: 700; color: #2E3644; line-height: 1.2; }
.universal-icons { position: fixed; top: 20px; right: 20px; z-index: 3000; display: flex; gap: 9px; align-items: center; }
.dropdown-container { position: relative; display: inline-block; }
.header-icon-btn { width: 42px; height: 42px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #2E3644; border: 1px solid #cbd5e1; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; box-shadow: 0 4px 14px rgba(80,60,120,.05); }
.header-icon-btn:hover { background: #FCE7F0; border-color: #fbcfe8; color: #D42759; transform: translateY(-2px);}
.user-avatar-btn { color: #000000 !important; overflow: hidden; padding: 0;}
.dropdown-menu { position: absolute; right: 0; top: 52px; background: white; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.dropdown-option { padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: #1e293b; transition: 0.2s; border-radius: 8px; display: block; text-align: left; text-decoration: none;}
.dropdown-option:hover { background: #f1f5f9; color: #D42759; }
.dropdown-divider { height: 1px; background-color: #e2e8f0; margin: 4px 8px; }
.notif-badge { position: absolute; top: -3px; right: -3px; background: #D42759; color: #fff; font-size: 9.5px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 100px; display: flex; align-items: center; justify-content: center; padding: 0 3px; border: 2px solid #fff; }

.feed-page { position: relative; z-index: 2000; width: 100%; min-height: 100vh; padding: 120px 24px 100px 24px; }
.feed-title { font-size: 18px; font-weight: 800; color: #212832; max-width: 900px; margin: 0 auto 16px auto; }

/* Recherche (demande du 08/09/2026) : lieu / groupe / pseudo — voir filterFeed() dans le
   script plus bas. */
.feed-search-wrap { position: relative; max-width: 900px; margin: 0 auto 18px auto; }
.feed-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.feed-search-input { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 100px; background: #fff; padding: 10px 14px 10px 36px; font-size: 13px; font-family: 'Poppins', sans-serif; color: #212832; outline: none; transition: 0.2s; }
.feed-search-input:focus { border-color: #D42759; }
/* Suggestions de comptes (demande du 10/09/2026) : en plus du filtrage de la grille de
   photos déjà en place (filterFeed), la recherche propose maintenant aussi les COMPTES
   correspondants — cliquer en ouvre le profil (voir openUserSuggestion() plus bas). */
.feed-user-suggestions { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.12); max-height: 260px; overflow-y: auto; z-index: 30; }
.feed-user-suggestion-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; transition: 0.15s; }
.feed-user-suggestion-row:hover { background: #FFF7F8; }
.feed-user-suggestion-avatar { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.feed-user-suggestion-name { font-size: 12.5px; font-weight: 700; color: #212832; }

/* Grille façon Instagram : 3 colonnes, tuiles carrées, gap minime (capture fournie par
   l'utilisateur le 08/09/2026). */
.feed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; max-width: 900px; margin: 0 auto; }
.feed-tile { position: relative; aspect-ratio: 1 / 1; background-size: cover; background-position: center; cursor: pointer; transition: 0.15s; overflow: hidden; }
.feed-tile:hover { opacity: 0.85; }
/* Avatar + likes en overlay par tuile (demande du 11/09/2026, capture d'écran fournie :
   "petit avatar en overlay + nombre de likes"). L'avatar redirige vers le profil de
   l'auteur — stopPropagation pour ne pas aussi ouvrir la publication (le reste de la
   tuile garde ce comportement, voir openFeedPost() plus bas). Le nombre de likes est un
   simple badge d'affichage ici (l'interaction "j'aime" reste dans la modale, comme sur
   profile.html) — chargé en tâche de fond après le premier rendu de la grille, pour ne
   jamais retarder son affichage initial. */
.feed-tile-avatar { position: absolute; left: 6px; bottom: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; z-index: 2; }
.feed-tile-likes { position: absolute; top: 6px; right: 6px; display: flex; align-items: center; gap: 3px; background: rgba(20,16,30,.5); color: #fff; font-size: 10.5px; font-weight: 700; padding: 3px 7px 3px 6px; border-radius: 100px; z-index: 2; }
.feed-tile-likes svg { width: 11px; height: 11px; flex-shrink: 0; }
.feed-tile-likes.liked svg { fill: #D42759; stroke: #D42759; }
.feed-empty, .feed-loading { text-align: center; color: #94a3b8; font-size: 13px; padding: 60px 0; }

/* Post en grand (clic sur une tuile, demande du 10/09/2026 : réutiliser la même modale
   "publication" que profile.html — voir #loc-modal plus bas — plutôt que l'ancien
   #feed-post-overlay propre à cette page. SANS la mini-carte Leaflet ("supprime la map
   de cette fenêtre") : #modal-map n'existe simplement pas ici, et openLocModal() (voir
   script.js) s'en passe déjà proprement (if(!mapEl) return;). Même charte que
   visited.html/profile.html pour la modale elle-même. */
.modal-content { padding: 0; }
.close-btn { top: 12px; right: 18px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.4); z-index: 10; }
#modal-hero { height: 320px; background-size: cover; background-position: center; border-radius: 16px 16px 0 0; display: flex; align-items: flex-end; padding: 20px; }
#modal-title { color: #fff; font-size: 20px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
.modal-body { padding: 20px 26px 28px 26px; }
#modal-meta { font-size: 12.5px; color: #D42759; font-weight: 700; margin-bottom: 16px; }
.modal-sub-label { font-size: 10px; font-weight: 700; letter-spacing: .8px; color: #64748b; text-transform: uppercase; margin-bottom: 8px; display: block; }
#modal-meta-box { background: #f8fafc; border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; font-size: 12.5px; line-height: 2; color: #334155; }
#modal-desc { font-size: 13px; line-height: 1.8; color: #3f495c; margin-bottom: 18px; }
.modal-map-link { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #2E3644; font-size: 12.5px; font-weight: 600; transition: .2s; }
.modal-map-link:hover { border-color: #D42759; color: #D42759; }
.modal-post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.modal-post-avatar { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-post-username { font-size: 13.5px; font-weight: 700; color: #212832; flex: 1; }
.modal-post-like-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; color: #212832; transition: 0.15s; }
.modal-post-like-btn.liked { color: #D42759; }
.modal-post-like-btn svg { transition: transform 0.15s; }
.modal-post-like-btn.liked svg { transform: scale(1.12); fill: #D42759; }
.modal-post-like-count { font-size: 12.5px; font-weight: 700; color: #212832; margin-left: 4px; }
.modal-post-caption { font-size: 13px; color: #475569; line-height: 1.5; font-style: italic; margin-bottom: 18px; word-break: break-word; }
@media (max-width: 760px) {
  .modal-content { width: 97%; border-radius: 12px; }
  .modal-body { padding: 18px 18px 22px 18px; }
  #modal-hero { height: 220px; border-radius: 12px 12px 0 0; }
  /* Plein écran (demande du 11/09/2026) : même règle que profile.html pour ce même
     modal réutilisé (#loc-modal + .post-modal, basculée par openLocModal() dans
     script.js selon qu'un postContext est passé) — n'existait jusqu'ici que dans le
     <style> propre à profile.html, donc sans effet ici sur feed.html malgré la classe
     posée correctement par le JS partagé. */
  #loc-modal.post-modal { padding: 0; align-items: stretch; }
  #loc-modal.post-modal .modal-content { width: 100%; height: 100%; max-width: 100%; max-height: 100%; border-radius: 0; display: flex; flex-direction: column; }
  #loc-modal.post-modal #modal-hero { flex-shrink: 0; height: 42vh; border-radius: 0; }
  #loc-modal.post-modal .modal-body { flex: 1; overflow-y: auto; }
}

@media (max-width: 760px) {
  /* Logo "Screen To Street" retiré sur mobile (demande du 10/09/2026) — comme sur
     profile.html, .universal-logo n'est PAS couvert par la règle globale de style.css
     qui ne masque que .top-nav/.universal-icons, donc un retrait explicite est
     nécessaire ici. */
  .universal-logo { display: none !important; }
  .header-icon-btn { width: 36px; height: 36px; }
  .feed-page { padding: 60px 12px 90px 12px; }
  .feed-grid { gap: 2px; }
  /* Barre de recherche réduite (demande du 10/09/2026 : "réduit la taille") — via
     transform:scale() sur le conteneur plutôt qu'en baissant le font-size réel de
     l'input, qui resterait sous 16px et redéclencherait le zoom automatique iOS au
     focus (même bug déjà rencontré et corrigé sur friends.html/.friend-add-row). */
  .feed-search-wrap { max-width: 270px; margin: 0 auto 14px auto; transform: scale(0.82); transform-origin: top center; }
}
</style>

</script>

<script>
    const feedAvatarPalette = ['#D42759', '#8B5CF6', '#F06090', '#10b981', '#3b82f6', '#f59e0b'];
    function feedAvatarColor(username) {
        let sum = 0;
        for (let i = 0; i < (username || '').length; i++) sum += username.charCodeAt(i);
        return feedAvatarPalette[sum % feedAvatarPalette.length];
    }

    let feedPhotos = [];

    // Empêche la page de rester bloquée sur "Loading..." indéfiniment (demande du
    // 08/09/2026, bug rapporté avec le compte "josyine" sur mobile) : auparavant, si
    // window.fetchGlobalPhotoFeed n'était pas encore disponible ou que la requête
    // Firestore ne répondait jamais, rien ne cachait #feed-loading. Un timeout ne coupe
    // pas l'appel Firestore sous-jacent, juste l'attente côté UI.
    function withTimeout(promise, ms) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
        ]);
    }

    // Affiche une liste de photos (le fil complet, ou un sous-ensemble filtré par
    // filterFeed() plus bas) — indexée sur feedPhotos (le fil complet) pour que
    // openFeedPost() retrouve toujours le bon like/uid même après un filtrage.
    function renderFeedGrid(photos) {
        const grid = document.getElementById('feed-grid');
        const emptyEl = document.getElementById('feed-empty');
        grid.innerHTML = '';
        if (!photos.length) { emptyEl.textContent = 'No results.'; emptyEl.classList.remove('hidden'); return; }
        emptyEl.classList.add('hidden');
        const heartSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"></path></svg>';
        photos.forEach(p => {
            const tile = document.createElement('div');
            tile.className = 'feed-tile';
            tile.style.backgroundImage = `url('${p.photo}')`;
            tile.title = p.locationName || '';
            tile.onclick = () => openFeedPost(feedPhotos.indexOf(p));
            tile.innerHTML = `
                <div class="feed-tile-avatar" style="background:${feedAvatarColor(p.username)};" title="${escapeHtml(p.username || '')}">${escapeHtml((p.username || 'U').charAt(0).toUpperCase())}</div>
                <div class="feed-tile-likes" data-photo-key="${p.uid}_${p.id}">${heartSvg}<span>${p.likeCount != null ? p.likeCount : '·'}</span></div>
            `;
            tile.querySelector('.feed-tile-avatar').onclick = (e) => {
                e.stopPropagation();
                if (p.username) window.location.href = 'profile.html?u=' + encodeURIComponent(p.username);
            };
            grid.appendChild(tile);
        });
        loadFeedTileLikes(photos);
    }

    // Charge le nombre de likes de chaque tuile visible EN TÂCHE DE FOND (jamais avant le
    // premier rendu de la grille) — un badge par photo, mis en cache sur l'objet `p` lui-
    // même pour ne pas re-consulter Firestore à chaque filtrage/re-rendu de la même photo.
    async function loadFeedTileLikes(photos) {
        if (typeof window.getPhotoLikeState !== 'function') return;
        await Promise.all(photos.map(async (p) => {
            const photoKey = p.uid + '_' + p.id;
            if (p.likeCount == null) {
                const state = await window.getPhotoLikeState(photoKey);
                p.likeCount = state.count;
                p.likedByMe = state.likedByMe;
            }
            const badge = document.querySelector(`.feed-tile-likes[data-photo-key="${CSS.escape(photoKey)}"]`);
            if (!badge) return;
            badge.querySelector('span').textContent = p.likeCount;
            badge.classList.toggle('liked', !!p.likedByMe);
        }));
    }

    // Recherche par lieu / groupe / pseudo (demande du 08/09/2026) : filtre côté client,
    // le fil entier est déjà chargé en mémoire.
    function filterFeed(text) {
        const q = (text || '').toLowerCase().trim();
        if (!q) { renderFeedGrid(feedPhotos); return; }
        renderFeedGrid(feedPhotos.filter(p =>
            (p.username || '').toLowerCase().includes(q) ||
            (p.locationName || '').toLowerCase().includes(q) ||
            (p.group || '').toLowerCase().includes(q)
        ));
    }
    document.getElementById('feed-search-input').addEventListener('input', (e) => filterFeed(e.target.value));

    // Suggestions de comptes (demande du 10/09/2026) : recherche "contient" (comme
    // friends.html, ajout d'ami), pour retrouver un pseudo tapé au milieu — pas
    // seulement en préfixe. Cliquer une suggestion ouvre le profil public de ce compte.
    let userSuggestDebounce = null;
    const suggestBox = document.getElementById('feed-user-suggestions');
    function openUserSuggestion(username) {
        window.location.href = 'profile.html?u=' + encodeURIComponent(username);
    }
    document.getElementById('feed-search-input').addEventListener('input', (e) => {
        clearTimeout(userSuggestDebounce);
        const q = e.target.value.trim();
        if (!q || typeof window.searchUsernamesContaining !== 'function') {
            suggestBox.classList.add('hidden');
            suggestBox.innerHTML = '';
            return;
        }
        userSuggestDebounce = setTimeout(async () => {
            const matches = await window.searchUsernamesContaining(q, 6);
            if (document.getElementById('feed-search-input').value.trim() !== q) return;
            if (!matches.length) { suggestBox.classList.add('hidden'); suggestBox.innerHTML = ''; return; }
            suggestBox.innerHTML = matches.map(m => `
                <div class="feed-user-suggestion-row" data-username="${escapeHtml(m.username)}">
                    <div class="feed-user-suggestion-avatar" style="background:${feedAvatarColor(m.username)};">${escapeHtml((m.username || 'U').charAt(0).toUpperCase())}</div>
                    <span class="feed-user-suggestion-name">${escapeHtml(m.username)}</span>
                </div>
            `).join('');
            suggestBox.querySelectorAll('.feed-user-suggestion-row').forEach(row => {
                row.addEventListener('click', () => openUserSuggestion(row.dataset.username));
            });
            suggestBox.classList.remove('hidden');
        }, 250);
    });
    document.getElementById('feed-search-input').addEventListener('blur', () => {
        setTimeout(() => suggestBox.classList.add('hidden'), 150);
    });
    document.getElementById('feed-search-input').addEventListener('focus', (e) => {
        if (suggestBox.innerHTML.trim()) suggestBox.classList.remove('hidden');
    });

    async function loadFeed() {
        const loadingEl = document.getElementById('feed-loading');
        const emptyEl = document.getElementById('feed-empty');
        try {
            if (typeof window.fetchGlobalPhotoFeed !== 'function') throw new Error('fetchGlobalPhotoFeed unavailable');
            feedPhotos = await withTimeout(window.fetchGlobalPhotoFeed(), 15000);
            // Groupe/artiste (pour la recherche ci-dessus) : pas renvoyé par
            // fetchGlobalPhotoFeed (firebase-init.js, module Firebase pur, n'a pas accès à
            // celebLocations, chargée par script.js) — enrichi ici plutôt.
            if (typeof celebLocations !== 'undefined') {
                feedPhotos.forEach(p => {
                    const loc = celebLocations.find(l => l.id === p.locationId || l.id === Number(p.locationId));
                    p.group = loc ? loc.group : '';
                });
            }
            loadingEl.classList.add('hidden');
            if (!feedPhotos.length) { document.getElementById('feed-empty').textContent = 'No public photos yet.'; document.getElementById('feed-empty').classList.remove('hidden'); return; }
            renderFeedGrid(feedPhotos);
        } catch (e) {
            console.warn('Chargement du fil de photos échoué :', e);
            loadingEl.classList.add('hidden');
            emptyEl.textContent = 'Loading failed — check your connection and try again.';
            emptyEl.classList.remove('hidden');
        }
    }

    // Ouvre la modale "publication" partagée (voir #loc-modal ci-dessus et
    // window.openLocModal() dans script.js) — demande du 10/09/2026 : remplace l'ancien
    // #feed-post-overlay propre à cette page par la même popup que profile.html. Ne fait
    // rien si p.locationId ne correspond à aucun lieu connu (même garde qu'ailleurs sur
    // le site, voir openLocModal()).
    function openFeedPost(index) {
        const p = feedPhotos[index];
        if (!p || typeof window.openLocModal !== 'function') return;
        window.openLocModal(p.locationId, {
            username: p.username,
            uid: p.uid,
            avatarColor: feedAvatarColor(p.username),
            photo: p.photo,
            caption: p.caption,
            photoKey: p.uid + '_' + p.id,
            photoId: p.standalone ? p.id : null
        });
    }

    window.addEventListener('firebase-ready', () => { loadFeed(); });
</script>
</body>
</html>
