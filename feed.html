<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
/* Ecran de chargement (demande du 12/09/2026, "affiche l'animation de chargement sur
   toutes les pages") - meme composant que index.html (voir #page-loader la-bas), copie
   ici a l'identique : CSS inline juste apres la balise viewport, avant tout <link>
   externe (polices, feuille de style), pour s'afficher des le tout premier rendu sans
   attendre un fichier externe. Masque par hidePageLoader() juste apres <body>. */
#page-loader { position: fixed; inset: 0; z-index: 99999; background: linear-gradient(135deg, #F5F3FC, #E3DEF5, #D8CFF0, #E3DEF5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity .4s ease; }
#page-loader.page-loader-hidden { opacity: 0; pointer-events: none; }
.page-loader-pin { width: 44px; height: 44px; }
.page-loader-dots { display: flex; gap: 9px; }
.page-loader-dot { width: 10px; height: 10px; border-radius: 50%; background: #D42759; animation: pageLoaderBounce 1.1s ease-in-out infinite; }
.page-loader-dot:nth-child(2) { background: #B9A8DA; animation-delay: .15s; }
.page-loader-dot:nth-child(3) { background: #D42759; opacity: .65; animation-delay: .3s; }
@keyframes pageLoaderBounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-10px); opacity: 1; } }
</style>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#E7E9EC">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
a{text-decoration:none;}
body{background:#E7E9EC;padding:0; min-height:100vh; overflow-x:hidden; overflow-y:auto;}
.hidden { display: none !important; }

/* FOND ANIMÉ (identique à profile.html/friends.html) */
.hero-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; background: linear-gradient(135deg, #F5F3FC, #E3DEF5, #D8CFF0, #E3DEF5); background-size: 200% 200%; animation: gradientShift 10s ease infinite; }
@keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; animation: float 12s infinite ease-in-out alternate; }
.blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: #e3d5f8; }
.blob-2 { bottom: -10%; right: -10%; width: 35vw; height: 35vw; background: #fce7f0; animation-delay: -4s; }
.blob-3 { top: 40%; left: 60%; width: 25vw; height: 25vw; background: #d9cdee; animation-delay: -8s; }
@keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(30px) scale(1.05); } }
.hero-background { animation-delay: calc(0s - var(--sync-t, 0s)) !important; }

/* Header desktop, identique aux autres pages (voir profile.html) — masqué sur mobile
   globalement (voir style.css), où #mobile-top-icons/.mobile-bottom-nav (injectées par
   script.js) prennent le relais. */
.universal-logo { position: fixed; top: 25px; left: 20px; z-index: 2500; display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
.brand-text { font-size: 19px; font-weight: 700; color: #2E3644; line-height: 1.2; }
.universal-icons { position: fixed; top: 20px; right: 20px; z-index: 3000; display: flex; gap: 9px; align-items: center; }
.dropdown-container { position: relative; display: inline-block; }
.header-icon-btn { width: 42px; height: 42px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #2E3644; border: 1px solid #cbd5e1; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; box-shadow: 0 4px 14px rgba(80,60,120,.05); }
.header-icon-btn:hover { background: #FCE7F0; border-color: #fbcfe8; color: #D42759; transform: translateY(-2px);}
.user-avatar-btn { color: #000000 !important; overflow: hidden; padding: 0;}
.dropdown-menu { position: absolute; right: 0; top: 52px; background: white; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.dropdown-option { padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: #1e293b; transition: 0.2s; border-radius: 8px; display: flex; align-items: center; gap: 8px; text-align: left; text-decoration: none; white-space: nowrap;}
.dropdown-option svg { flex-shrink: 0; }
.dropdown-option:hover { background: #f1f5f9; color: #D42759; }
.dropdown-divider { height: 1px; background-color: #e2e8f0; margin: 4px 8px; }
.notif-badge { position: absolute; top: -3px; right: -3px; background: #D42759; color: #fff; font-size: 9.5px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 100px; display: flex; align-items: center; justify-content: center; padding: 0 3px; border: 2px solid #fff; }

.feed-page { position: relative; z-index: 2000; width: 100%; min-height: 100vh; padding: 120px 24px 100px 24px; }
.feed-title { font-size: 18px; font-weight: 800; color: #212832; max-width: 900px; margin: 0 auto 16px auto; }

/* Onglets Explore/Saved (demande du 13/09/2026) — même idée que .profile-tabs de
   profile.html (soulignement rose au survol/actif), reprise ici localement puisque
   feed.html n'importe pas la feuille de style de cette page-là. */
.feed-tabs { display: flex; gap: 6px; border-bottom: 2px solid #e2e8f0; max-width: 900px; margin: 0 auto 18px auto; }
.feed-tab-btn { flex: 1; background: none; border: none; padding: 10px 6px; font-size: 12.5px; font-weight: 700; color: #94a3b8; cursor: pointer; font-family: 'Poppins', sans-serif; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: 0.2s; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; justify-content: center; gap: 6px; }
.feed-tab-btn:hover { color: #D42759; }
.feed-tab-btn.active { color: #D42759; border-bottom-color: #D42759; }

/* Recherche (demande du 08/09/2026) : lieu / groupe / pseudo — voir filterFeed() dans le
   script plus bas. */
.feed-search-wrap { position: relative; max-width: 900px; margin: 0 auto 18px auto; }
.feed-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.feed-search-input { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 100px; background: #fff; padding: 10px 14px 10px 36px; font-size: 13px; font-family: 'Poppins', sans-serif; color: #212832; outline: none; transition: 0.2s; }
.feed-search-input:focus { border-color: #D42759; }
/* Suggestions de comptes (demande du 10/09/2026) : en plus du filtrage de la grille de
   photos déjà en place (filterFeed), la recherche propose maintenant aussi les COMPTES
   correspondants — cliquer en ouvre le profil (voir openUserSuggestion() plus bas). */
.feed-user-suggestions { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.12); max-height: 260px; overflow-y: auto; z-index: 30; }
.feed-user-suggestion-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; transition: 0.15s; }
.feed-user-suggestion-row:hover { background: #FFF7F8; }
.feed-user-suggestion-avatar { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.feed-user-suggestion-name { font-size: 12.5px; font-weight: 700; color: #212832; }

/* Grille façon Instagram : 3 colonnes, tuiles carrées, gap minime (capture fournie par
   l'utilisateur le 08/09/2026). */
.feed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; max-width: 900px; margin: 0 auto; }
.feed-tile { position: relative; aspect-ratio: 1 / 1; background-size: cover; background-position: center; cursor: pointer; transition: 0.15s; overflow: hidden; }
.feed-tile:hover { opacity: 0.85; }
/* Avatar + likes en overlay par tuile (demande du 11/09/2026, capture d'écran fournie :
   "petit avatar en overlay + nombre de likes"). L'avatar redirige vers le profil de
   l'auteur — stopPropagation pour ne pas aussi ouvrir la publication (le reste de la
   tuile garde ce comportement, voir openFeedPost() plus bas). Le nombre de likes est un
   simple badge d'affichage ici (l'interaction "j'aime" reste dans la modale, comme sur
   profile.html) — chargé en tâche de fond après le premier rendu de la grille, pour ne
   jamais retarder son affichage initial. */
.feed-tile-avatar { position: absolute; left: 6px; bottom: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; z-index: 2; }
.feed-tile-likes { position: absolute; top: 6px; right: 6px; display: flex; align-items: center; gap: 3px; background: rgba(20,16,30,.5); color: #fff; font-size: 10.5px; font-weight: 700; padding: 3px 7px 3px 6px; border-radius: 100px; z-index: 2; cursor: pointer; }
.feed-tile-likes svg { width: 11px; height: 11px; flex-shrink: 0; }
.feed-tile-likes.liked svg { fill: #D42759; stroke: #D42759; }
/* Onglet "Sacred Places" (demande du 14/09/2026) : tuiles de lieux officiels du site, pas
   des publications d'utilisateurs — ni avatar ni compteur de likes (voir renderSacredGrid()
   plus bas), remplacés par ce seul badge "Official". */
.feed-tile-official-badge { position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px; background: rgba(20,16,30,.55); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; padding: 4px 8px; border-radius: 100px; z-index: 2; }
.feed-tile-official-badge svg { width: 10px; height: 10px; flex-shrink: 0; }
.feed-empty, .feed-loading { text-align: center; color: #94a3b8; font-size: 13px; padding: 60px 0; }

/* Post en grand (clic sur une tuile, demande du 10/09/2026 : réutiliser la même modale
   "publication" que profile.html — voir #loc-modal plus bas — plutôt que l'ancien
   #feed-post-overlay propre à cette page. SANS la mini-carte Leaflet ("supprime la map
   de cette fenêtre") : #modal-map n'existe simplement pas ici, et openLocModal() (voir
   script.js) s'en passe déjà proprement (if(!mapEl) return;). Même charte que
   visited.html/profile.html pour la modale elle-même. */
.modal-content { padding: 0; }
.close-btn { top: 12px; right: 18px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.4); z-index: 10; }
#modal-hero { height: 320px; background-size: cover; background-position: center; border-radius: 16px 16px 0 0; display: flex; align-items: flex-end; padding: 20px; position: relative; overflow: hidden; }
#modal-title { color: #fff; font-size: 20px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.3); position: relative; z-index: 2; }
/* Galerie "Mei's Pictures" (demande du 19/09/2026, "parfois pour un lieu il y a plusieurs
   photos de Mei... le reste apparait quand on clique sur le post... comme dans Instagram...
   on défile ensuite les photos à l'horizontal") : la tuile du feed (voir renderSacredGrid())
   continue de n'afficher que la 1ère photo (loc.recreatedPhotos[0]) comme avant, mais un
   clic dessus ouvre maintenant TOUTES les photos du lieu en défilement horizontal avec
   scroll-snap, plutôt qu'uniquement la 1ère — voir openLocModal() dans script.js
   (postContext.photos) et openSacredPlace() plus bas dans cette page. Masquée par défaut
   (une seule <div class="modal-hero-slide">, pas de scroll) pour ne rien changer aux
   autres usages de cette même modale (publication utilisateur, fiche lieu classique...),
   seulement peuplée avec plusieurs slides quand postContext.photos a 2 éléments ou plus.
   #modal-hero garde son background-image existant comme repli (voir openLocModal) tant que
   le JS n'a pas eu le temps de peupler la galerie. */
.modal-hero-gallery { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; z-index: 1; }
.modal-hero-gallery::-webkit-scrollbar { display: none; }
.modal-hero-gallery.hidden { display: none; }
.modal-hero-slide { flex: 0 0 100%; height: 100%; background-size: cover; background-position: center; scroll-snap-align: start; }
#modal-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); pointer-events: none; z-index: 1; display: none; }
#modal-hero.modal-hero-gallery-active::after { display: block; }
.modal-hero-dots { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 2; }
.modal-hero-dots.hidden { display: none; }
.modal-hero-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.45); transition: background .2s; }
.modal-hero-dot.active { background: #fff; }
.modal-body { padding: 20px 26px 28px 26px; }
#modal-meta { font-size: 12.5px; color: #D42759; font-weight: 700; margin-bottom: 16px; }
.modal-sub-label { font-size: 10px; font-weight: 700; letter-spacing: .8px; color: #64748b; text-transform: uppercase; margin-bottom: 8px; display: block; }
#modal-meta-box { background: #f8fafc; border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; font-size: 12.5px; line-height: 2; color: #334155; }
#modal-desc { font-size: 13px; line-height: 1.8; color: #3f495c; margin-bottom: 18px; }
.modal-map-link { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #2E3644; font-size: 12.5px; font-weight: 600; transition: .2s; }
.modal-map-link:hover { border-color: #D42759; color: #D42759; }
.modal-post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.modal-post-avatar { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-post-username { font-size: 13.5px; font-weight: 700; color: #212832; flex: 1; }
.modal-post-like-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; color: #212832; transition: 0.15s; }
.modal-post-like-btn.liked { color: #D42759; }
.modal-post-like-btn svg { transition: transform 0.15s; }
.modal-post-like-btn.liked svg { transform: scale(1.12); fill: #D42759; }
.modal-post-like-count { font-size: 12.5px; font-weight: 700; color: #212832; margin-left: 4px; }
.modal-post-save-btn { background: none; border: none; cursor: pointer; padding: 4px; margin-left: 6px; display: flex; align-items: center; color: #212832; transition: 0.15s; }
.modal-post-save-btn.saved { color: #D42759; }
.modal-post-save-btn svg { transition: transform 0.15s; }
.modal-post-save-btn.saved svg { transform: scale(1.1); fill: #D42759; }
.modal-post-caption { font-size: 13px; color: #475569; line-height: 1.5; font-style: italic; margin-bottom: 18px; word-break: break-word; }
@media (max-width: 760px) {
  .modal-content { width: 97%; border-radius: 12px; }
  .modal-body { padding: 18px 18px 22px 18px; }
  #modal-hero { height: 220px; border-radius: 12px 12px 0 0; }
  /* Plein écran (demande du 11/09/2026) : même règle que profile.html pour ce même
     modal réutilisé (#loc-modal + .post-modal, basculée par openLocModal() dans
     script.js selon qu'un postContext est passé) — n'existait jusqu'ici que dans le
     <style> propre à profile.html, donc sans effet ici sur feed.html malgré la classe
     posée correctement par le JS partagé. */
  #loc-modal.post-modal { padding: 0; align-items: stretch; }
  #loc-modal.post-modal .modal-content { width: 100%; height: 100%; max-width: 100%; max-height: 100%; border-radius: 0; display: flex; flex-direction: column; }
  #loc-modal.post-modal #modal-hero { flex-shrink: 0; height: 42vh; border-radius: 0; }
  #loc-modal.post-modal .modal-body { flex: 1; overflow-y: auto; }
}

@media (max-width: 760px) {
  /* Logo "Screen To Street" retiré sur mobile (demande du 10/09/2026) — comme sur
     profile.html, .universal-logo n'est PAS couvert par la règle globale de style.css
     qui ne masque que .top-nav/.universal-icons, donc un retrait explicite est
     nécessaire ici. */
  .universal-logo { display: none !important; }
  .header-icon-btn { width: 36px; height: 36px; }
  .feed-page { padding: 60px 12px 90px 12px; }
  .feed-grid { gap: 2px; }
  /* Titre "Explore" retiré sur mobile (demande du 12/09/2026, "supprime le titre Explore
     pour gagner de la place") — l'onglet "Explore" juste en dessous (.feed-tabs) indique
     déjà où on se trouve, pas besoin d'un second titre identique au-dessus. Uniquement
     mobile : desktop garde ce titre. */
  .feed-title { display: none; }
  /* Barre de recherche déplacée AU-DESSUS des onglets, alignée à gauche (demande du
     12/09/2026) : .feed-page passe en flex-column sur mobile seulement, juste pour que
     order:-1 puisse faire remonter .feed-search-wrap avant .feed-tabs dans l'affichage
     sans toucher au HTML (order n'a aucun effet hors flex/grid) — .feed-grid garde son
     propre display:grid, indépendant du conteneur parent.
     Barre allongée sur toute la largeur de la PAGE (demande du 13/09/2026) : l'ancien
     max-width:220px + transform:scale(0.82) (qui réduisait visuellement la boîte ENTIÈRE,
     largeur comprise, tout en gardant une vraie font-size >=16px sous le capot pour éviter
     le zoom iOS au focus — voir "input, textarea { font-size: 16px !important; }" dans
     style.css) est retiré : la boîte occupe maintenant 100% de la largeur disponible
     (stretch par défaut d'un enfant flex-column), donc la vraie taille de police (16px,
     imposée par cette même règle globale) s'affiche sans distorsion ni espace vide à
     droite. Fond blanc remplacé par un effet transparent/verre dépoli ("j'aime pas le
     fond blanc ... effet transparent") qui laisse deviner le dégradé animé de la page
     derrière la barre. */
  .feed-page { display: flex; flex-direction: column; }
  .feed-search-wrap { order: -1; margin: 0 0 12px 0; }
  /* Barre plus fine en HAUTEUR seulement (demande du 13/09/2026, capture d'écran fournie) —
     distinct de "plus fine" au sens largeur (déjà traité juste au-dessus, toute la largeur
     de la page). Seul le padding vertical baisse ; la vraie font-size reste 16px (aucun
     changement ici), donc pas de risque de zoom iOS au focus — impossible de descendre le
     padding vertical plus bas que ça sans que le texte touche visuellement les bords. */
  .feed-search-input { background: rgba(255,255,255,.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1.5px solid rgba(255,255,255,.6); padding: 6px 16px 6px 38px; }
  .feed-search-icon { left: 14px; }
  /* Onglets Explore/Saved étirés jusqu'aux bords de l'ÉCRAN (demande du 13/09/2026,
     distincte de la barre de recherche ci-dessus qui reste "à la largeur de la page") :
     marge négative égale au padding horizontal de .feed-page (12px) pour déborder
     jusqu'aux bords réels, même mécanisme de bleed que .profile-mini-map sur
     profile.html. */
  .feed-tabs { max-width: none; width: calc(100% + 24px); margin: 0 -12px 18px -12px; }
}
</style>
<script>
    if (!sessionStorage.getItem('bgSyncTime')) { sessionStorage.setItem('bgSyncTime', Date.now()); }
    document.documentElement.style.setProperty('--sync-t', ((Date.now() - parseInt(sessionStorage.getItem('bgSyncTime'))) / 1000) + 's');
</script>

<body>
<!-- Ecran de chargement (voir le commentaire CSS dans <head>) : retire des que la page a
     fini de charger (window 'load') ou apres 8s au maximum dans tous les cas, pour ne
     jamais rester bloque si l'evenement ne se declenche jamais. -->
<div id="page-loader">
    <svg class="page-loader-pin" viewBox="0 0 400 400">
      <path d="M200,50 C148,50 106,92 106,146 C106,220 200,340 200,340 C200,340 294,220 294,146 C294,92 252,50 200,50 Z" fill="#2E3644"/>
      <circle cx="200" cy="150" r="26" fill="#D42759"/>
    </svg>
    <div class="page-loader-dots">
        <span class="page-loader-dot"></span>
        <span class="page-loader-dot"></span>
        <span class="page-loader-dot"></span>
    </div>
</div>
<script>
    (function () {
        var hidden = false;
        function hidePageLoader() {
            if (hidden) return;
            hidden = true;
            var el = document.getElementById('page-loader');
            if (!el) return;
            el.classList.add('page-loader-hidden');
            setTimeout(function () { el.remove(); }, 450);
        }
        window.addEventListener('load', hidePageLoader);
        setTimeout(hidePageLoader, 8000);
    })();
</script>

<div class="hero-background">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
</div>

<!-- Header desktop, identique aux autres pages — masqué sur mobile globalement (voir
     style.css), où #mobile-top-icons/.mobile-bottom-nav (injectées par script.js)
     prennent le relais. -->
<a href="map.html" class="universal-logo">
    <svg width="38" height="38" viewBox="0 0 400 400" style="flex-shrink:0;">
        <path d="M200,50 C148,50 106,92 106,146 C106,220 200,340 200,340 C200,340 294,220 294,146 C294,92 252,50 200,50 Z" fill="#2E3644"/>
        <circle cx="200" cy="150" r="26" fill="#D42759"/>
    </svg>
    <div><div class="brand-text">Screen To <b style="color: #D42759;">Street</b></div></div>
</a>

<div class="universal-icons">
    <div class="dropdown-container">

<script>
    const feedAvatarPalette = ['#D42759', '#8B5CF6', '#F06090', '#10b981', '#3b82f6', '#f59e0b'];
    function feedAvatarColor(username) {
        let sum = 0;
        for (let i = 0; i < (username || '').length; i++) sum += username.charCodeAt(i);
        return feedAvatarPalette[sum % feedAvatarPalette.length];
    }

    let feedPhotos = [];

    // Empêche la page de rester bloquée sur "Loading..." indéfiniment (demande du
    // 08/09/2026, bug rapporté avec le compte "josyine" sur mobile) : auparavant, si
    // window.fetchGlobalPhotoFeed n'était pas encore disponible ou que la requête
    // Firestore ne répondait jamais, rien ne cachait #feed-loading. Un timeout ne coupe
    // pas l'appel Firestore sous-jacent, juste l'attente côté UI.
    function withTimeout(promise, ms) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
        ]);
    }

    // Affiche une liste de photos (le fil complet, ou un sous-ensemble filtré par
    // filterFeed() plus bas) — indexée sur feedPhotos (le fil complet) pour que
    // openFeedPost() retrouve toujours le bon like/uid même après un filtrage.
    function renderFeedGrid(photos, emptyMessage) {
        const grid = document.getElementById('feed-grid');
        const emptyEl = document.getElementById('feed-empty');
        grid.innerHTML = '';
        if (!photos.length) { emptyEl.textContent = emptyMessage || 'No results.'; emptyEl.classList.remove('hidden'); return; }
        emptyEl.classList.add('hidden');
        const heartSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"></path></svg>';
        photos.forEach(p => {
            const tile = document.createElement('div');
            tile.className = 'feed-tile';
            tile.style.backgroundImage = `url('${p.photo}')`;
            tile.title = p.locationName || '';
            tile.onclick = () => openFeedPost(feedPhotos.indexOf(p));
            tile.innerHTML = `
                <div class="feed-tile-avatar" style="background:${feedAvatarColor(p.username)};" title="${escapeHtml(p.username || '')}">${escapeHtml((p.username || 'U').charAt(0).toUpperCase())}</div>
                <div class="feed-tile-likes" data-photo-key="${p.uid}_${p.id}">${heartSvg}<span>${p.likeCount != null ? p.likeCount : '·'}</span></div>
            `;
            tile.querySelector('.feed-tile-avatar').onclick = (e) => {
                e.stopPropagation();
                if (p.username) window.location.href = 'profile.html?u=' + encodeURIComponent(p.username);
            };
            // Liker directement depuis la grille en cliquant le cœur (demande du 12/09/2026,
            // jusqu'ici il fallait ouvrir la publication en entier) — stopPropagation pour ne
            // pas aussi déclencher tile.onclick (qui ouvrirait la modale par-dessus). Même
            // logique optimiste que #modal-post-like-btn dans script.js : le badge change
            // immédiatement, togglePhotoLike() part en tâche de fond.
            const likesBadge = tile.querySelector('.feed-tile-likes');
            likesBadge.onclick = async (e) => {
                e.stopPropagation();
                const nowLiked = !likesBadge.classList.contains('liked');
                likesBadge.classList.toggle('liked', nowLiked);
                const countEl = likesBadge.querySelector('span');
                const current = parseInt(countEl.textContent, 10) || 0;
                countEl.textContent = Math.max(0, current + (nowLiked ? 1 : -1));
                p.likeCount = Math.max(0, current + (nowLiked ? 1 : -1));
                p.likedByMe = nowLiked;
                if (typeof window.togglePhotoLike === 'function') await window.togglePhotoLike(p.uid + '_' + p.id, nowLiked);
            };
            grid.appendChild(tile);
        });
        loadFeedTileLikes(photos);
    }

    // Marque les tuiles déjà aimées par MOI (demande du 13/09/2026, optimisation perf) :
    // le nombre de likes de chaque tuile vient déjà de fetchGlobalPhotoFeed()
    // (p.likeCount, dénormalisé côté écriture — voir firebase-init.js), donc il ne reste
    // que "est-ce que JE l'ai aimée" à déterminer — UNE seule lecture pour tout le fil
    // (listMyLikedPhotoKeys(), miroir sur users/{uid}) plutôt qu'un getPhotoLikeState()
    // par tuile comme avant (c'était le deuxième symptôme signalé : "le compteur de
    // J'aime télécharge les documents au lieu d'un compteur côté serveur").
    let _myLikedKeysCache = null;
    async function loadFeedTileLikes(photos) {
        if (typeof window.listMyLikedPhotoKeys !== 'function') return;
        if (!_myLikedKeysCache) _myLikedKeysCache = new Set(await window.listMyLikedPhotoKeys());
        photos.forEach(p => {
            const photoKey = p.uid + '_' + p.id;
            if (p.likedByMe == null) p.likedByMe = _myLikedKeysCache.has(photoKey);
            const badge = document.querySelector(`.feed-tile-likes[data-photo-key="${CSS.escape(photoKey)}"]`);
            if (!badge) return;
            badge.querySelector('span').textContent = p.likeCount != null ? p.likeCount : 0;
            badge.classList.toggle('liked', !!p.likedByMe);
        });
    }

    // Recherche par lieu / groupe / pseudo (demande du 08/09/2026) : filtre côté client,
    // le fil entier est déjà chargé en mémoire.
    function filterFeed(text) {
        const q = (text || '').toLowerCase().trim();
        if (!q) { renderFeedGrid(feedPhotos); return; }
        renderFeedGrid(feedPhotos.filter(p =>
            (p.username || '').toLowerCase().includes(q) ||
            (p.locationName || '').toLowerCase().includes(q) ||
            (p.group || '').toLowerCase().includes(q)
        ));
    }
    document.getElementById('feed-search-input').addEventListener('input', (e) => filterFeed(e.target.value));

    // Onglets (demande du 13/09/2026, "Explore"/"Saved" ; renommé/étendu le 14/09/2026).
    // "Saved" filtre feedPhotos (déjà chargé pour Community) sur les clés renvoyées par
    // window.listMySavedPhotoKeys() — pas de second fetch réseau des publications
    // elles-mêmes. "Sacred Places" (tous les lieux du site) est un contenu totalement
    // différent (celebLocations, pas feedPhotos) — voir renderSacredGrid() plus bas.
    let currentFeedTab = 'community';
    // Échec du chargement initial de "Community" (demande du 20/09/2026, "je veux pouvoir
    // voir les photos de Community... fait en sorte que ça fonctionne") — jusqu'ici, un
    // premier échec (timeout réseau mobile, voir loadFeed() plus bas) laissait feedPhotos
    // vide DÉFINITIVEMENT : revenir sur cet onglet ne faisait que filterFeed() sur ce
    // tableau toujours vide, sans jamais retenter la lecture Firestore — aucun moyen de
    // récupérer sans recharger toute la page. Voir la branche "community" ci-dessous.
    let communityLoadFailed = false;
    window.switchFeedTab = function (tab) {
        currentFeedTab = tab;
        document.querySelectorAll('.feed-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.getElementById('feed-search-wrap').classList.toggle('hidden', tab === 'saved' || tab === 'sacred');
        if (tab === 'saved') {
            loadSavedFeed();
        } else if (tab === 'sacred') {
            renderSacredGrid();
        } else if (communityLoadFailed) {
            loadFeed();
        } else {
            filterFeed(document.getElementById('feed-search-input').value);
        }
    };

    // Onglet "Mei's Pictures" (demande du 15/09/2026, "l'onglet 'Sacred places' ne
    // fonctionne pas... je n'aime pas le nom... renomme... affiche les photos de 'Recreate
    // the Photo' des lieux", renommé "Mei's Pictures" + passé en galerie multi-photos le
    // 18/09/2026) — construit la grille à partir des lieux qui ont au moins une photo dans
    // loc.recreatedPhotos (tableau) ou, à défaut, l'ancien loc.recreatedPhoto (chaîne
    // unique, lieux jamais migrés) — voir window.createPhotoGalleryField() dans script.js —
    // au lieu de TOUS les lieux du site, et affiche la première de ces photos comme
    // vignette. Un clic ouvre désormais la modale de détail partagée (#loc-modal, voir
    // openSacredPlace() plus bas) au lieu de naviguer vers map.html (demande du 15/09/2026,
    // "comme dans Community") : plus de restauration d'onglet/scroll au retour du bouton
    // Précédent à gérer, la page ne quitte plus jamais l'onglet. Noms de variables/fonctions
    // laissés en "sacred" en interne (jamais visibles) pour limiter le diff — seuls le
    // libellé de l'onglet et le contenu affiché changent.
    const cameraBadgeSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>';
    // Première photo de loc.recreatedPhotos (tableau, format courant depuis le 18/09/2026),
    // ou repli sur l'ancien loc.recreatedPhoto (chaîne unique) pour les lieux jamais migrés.
    function firstRecreatedPhoto(loc) {
        return (Array.isArray(loc.recreatedPhotos) && loc.recreatedPhotos.length) ? loc.recreatedPhotos[0] : (loc.recreatedPhoto || '');
    }
    let sacredGridRendered = false;
    // Liste ordonnée des lieux affichés dans cet onglet + index de celui actuellement
    // ouvert dans la modale (-1 = aucun, ou modale ouverte depuis un autre onglet) — sert au
    // swipe entre photos (voir wireSacredSwipe() plus bas).
    let sacredLocs = [];
    let sacredSwipeIndex = -1;
    // Photos les plus récentes, par-dessus le catalogue statique (demande du 19/09/2026,
    // "il manque des photos" dans cet onglet) — voir window.fetchAllRecreatedPhotos() dans
    // firebase-init.js (index léger locationPhotos/, PAS l'ancien
    // window.fetchAllLocationContent() qui téléchargeait la collection locationContent
    // ENTIÈRE — descriptions multilingues, tips, liens sociaux de CHAQUE lieu — rien que
    // pour en extraire ce champ ; c'était la cause du "la page feed charge à l'infini sur
    // mobile" rapporté le 20/09/2026, ce téléchargement n'ayant en plus aucun timeout ici
    // contrairement à loadFeed()/loadSavedFeed() plus bas). Une promesse plutôt qu'un
    // simple objet : si l'onglet est cliqué plusieurs fois avant la fin de la 1ère lecture,
    // les appels suivants attendent la MÊME requête au lieu d'en déclencher une nouvelle à
    // chaque clic. Remise à null en cas d'échec/timeout pour permettre un nouvel essai en
    // revenant sur l'onglet, comme loadSavedFeed().
    // BUG corrigé (demande du 20/09/2026, "Mei's pictures n'apparait toujours pas sur
    // mobile") : contrairement à loadFeed() (Community), qui n'est appelée QUE depuis le
    // listener "firebase-ready"/son repli 8s (voir tout en bas de ce fichier),
    // renderSacredGrid() se déclenche directement au clic sur l'onglet — y compris AVANT que
    // le <script type="module" src="firebase-init.js"> ait fini de charger (un module ES,
    // plus lent à s'exécuter qu'un <script> classique, sur un réseau mobile plus lent). Si
    // l'onglet était tapé à cet instant précis, window.fetchAllRecreatedPhotos n'existait pas
    // encore : le code ci-dessous figeait alors sacredContentPromise sur `Promise.resolve({})`
    // — un résultat vide mis en cache DÉFINITIVEMENT pour le reste de la visite, jamais
    // réessayé même une fois Firebase chargé quelques instants plus tard. La grille retombait
    // alors sur le repli recreatedPhoto(s) du catalogue statique (celebLocations) — repli lui
    // -même peu fiable (voir la note sur window.adminBackfillLocationPhotos() dans
    // firebase-init.js : la plupart des fichiers images/admin-upload-*-recreated*.jpg qu'il
    // référence ne sont jamais réellement committés) — d'où des tuiles sans photo visible.
    // Plus courant sur mobile (page perçue comme chargée, donc tapée plus vite, avant que le
    // module Firebase ait fini), plus rare sur desktop — expliquant le symptôme "marche sur
    // ordinateur, pas sur mobile". On attend maintenant "firebase-ready" (ou 8s au maximum,
    // même délai que le repli de loadFeed() plus bas) avant de conclure que Firebase est
    // indisponible.
    function waitForFirebaseReady(maxMs) {
        return new Promise((resolve) => {
            if (typeof window.fetchAllRecreatedPhotos === 'function') { resolve(); return; }
            const onReady = () => { clearTimeout(timer); resolve(); };
            window.addEventListener('firebase-ready', onReady, { once: true });
            const timer = setTimeout(() => { window.removeEventListener('firebase-ready', onReady); resolve(); }, maxMs);
        });
    }
    let sacredContentPromise = null;
    async function renderSacredGrid() {
        const grid = document.getElementById('feed-grid');
        const emptyEl = document.getElementById('feed-empty');
        const loadingEl = document.getElementById('feed-loading');
        if (!sacredContentPromise) {
            loadingEl.classList.remove('hidden');
            emptyEl.classList.add('hidden');
            grid.innerHTML = '';
            sacredContentPromise = (async () => {
                if (typeof window.fetchAllRecreatedPhotos !== 'function') await waitForFirebaseReady(8000);
                return typeof window.fetchAllRecreatedPhotos === 'function'
                    ? withTimeout(window.fetchAllRecreatedPhotos(), 15000)
                    : {};
            })();
        }
        let livePhotos;
        try {
            livePhotos = await sacredContentPromise;
        } catch (e) {
            console.warn('Chargement des photos "Mei\'s Pictures" échoué :', e);
            sacredContentPromise = null;
            loadingEl.classList.add('hidden');
            if (currentFeedTab !== 'sacred') return;
            grid.innerHTML = '';
            emptyEl.textContent = 'Loading failed — check your connection and try again.';
            emptyEl.classList.remove('hidden');
            return;
        }
        loadingEl.classList.add('hidden');
        // L'utilisateur a déjà changé d'onglet pendant l'attente réseau ci-dessus (même
        // garde que loadFeed() pour "community") : ne pas dessiner par-dessus l'onglet
        // entre-temps affiché.
        if (currentFeedTab !== 'sacred') return;
        const baseLocs = typeof celebLocations !== 'undefined' ? celebLocations : [];
        // Object.assign({}, loc, {recreatedPhotos}) plutôt qu'une mutation de celebLocations :
        // même convention que fetchLocationContent() ailleurs sur le site (script.js), pour
        // ne jamais faire fuiter du contenu Firestore potentiellement plus frais vers
        // d'autres usages de ce tableau partagé. livePhotos[id].photos prime sur le
        // catalogue statique (repli sur recreatedPhotos/recreatedPhoto du squelette pour un
        // lieu jamais republié via cet index, ex: migration en cours).
        sacredLocs = baseLocs.map(loc => {
            const entry = livePhotos[String(loc.id)];
            const photos = (entry && Array.isArray(entry.photos) && entry.photos.length)
                ? entry.photos
                : ((Array.isArray(loc.recreatedPhotos) && loc.recreatedPhotos.length) ? loc.recreatedPhotos : (loc.recreatedPhoto ? [loc.recreatedPhoto] : []));
            return photos.length ? Object.assign({}, loc, { recreatedPhotos: photos }) : null;
        }).filter(Boolean);
        if (!sacredLocs.length) { grid.innerHTML = ''; emptyEl.textContent = 'No recreated photos yet.'; emptyEl.classList.remove('hidden'); return; }
        emptyEl.classList.add('hidden');
        grid.innerHTML = '';
        sacredLocs.forEach(loc => {
            const tile = document.createElement('div');
            tile.className = 'feed-tile';
            tile.style.backgroundImage = `url('${firstRecreatedPhoto(loc)}')`;
            tile.title = loc.name || '';
            tile.innerHTML = `<div class="feed-tile-official-badge">${cameraBadgeSvg}</div>`;
            tile.onclick = () => openSacredPlace(loc.id);
            grid.appendChild(tile);
        });
        sacredGridRendered = true;
    }

    // Ouvre la modale "publication" partagée (voir #loc-modal et window.openLocModal() dans
    // script.js), avec la photo recréée comme visuel principal — pas de postContext.username
    // ici (ce n'est pas une publication utilisateur) : openLocModal() masque alors l'entête
    // "auteur"/like/save et n'affiche que le détail du lieu, exactement ce qu'on veut.
    function openSacredPlace(locId) {
        const loc = sacredLocs.find(l => l.id == locId);
        if (!loc || typeof window.openLocModal !== 'function') return;
        sacredSwipeIndex = sacredLocs.indexOf(loc);
        const photo = firstRecreatedPhoto(loc);
        // Toutes les photos du lieu (demande du 19/09/2026) — pas seulement la 1ère : voir
        // le carrousel horizontal ajouté dans openLocModal() (script.js), qui s'active dès
        // que postContext.photos contient plus d'une photo.
        const photos = Array.isArray(loc.recreatedPhotos) && loc.recreatedPhotos.length ? loc.recreatedPhotos : (photo ? [photo] : []);
        window.openLocModal(locId, photo ? { photo, photos } : undefined);
    }

    // Swipe gauche/droite pour passer à la photo recréée suivante/précédente pendant que la
    // modale est ouverte (demande du 15/09/2026, "je n'arrive pas à swipe") — #loc-modal est
    // partagé avec l'onglet Community/profile.html, donc le geste ne doit être actif QUE pour
    // une modale ouverte depuis CET onglet : sacredSwipeIndex reste à -1 sinon, et est remis à
    // -1 dès que la modale se referme (peu importe comment) via l'observateur ci-dessous.
    (function wireSacredSwipe() {
        const modalHero = document.getElementById('modal-hero');
        const modalOverlay = document.getElementById('loc-modal');
        if (!modalHero || !modalOverlay) return;
        let touchStartX = null;
        modalHero.addEventListener('touchstart', (e) => {
            if (sacredSwipeIndex === -1) return;
            touchStartX = e.touches[0].clientX;
        }, { passive: true });
        modalHero.addEventListener('touchend', (e) => {
            // Désactivé quand la galerie multi-photos (demande du 19/09/2026) est active :
            // le défilement horizontal natif entre les photos DU MÊME lieu (scroll-snap,
            // voir openLocModal() dans script.js) ne doit pas se faire concurrence avec ce
            // swipe-ci, qui change de LIEU entier — sinon les deux gestes interfèrent sur le
            // même geste tactile horizontal.
            if (modalHero.classList.contains('modal-hero-gallery-active')) return;
            if (sacredSwipeIndex === -1 || touchStartX === null) return;
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            touchStartX = null;
            if (Math.abs(deltaX) < 50) return; // geste trop court pour être un swipe volontaire
            const nextIndex = deltaX < 0
                ? Math.min(sacredSwipeIndex + 1, sacredLocs.length - 1)
                : Math.max(sacredSwipeIndex - 1, 0);
            if (nextIndex === sacredSwipeIndex) return;
            openSacredPlace(sacredLocs[nextIndex].id);
        }, { passive: true });
        new MutationObserver(() => {
            if (modalOverlay.classList.contains('hidden')) sacredSwipeIndex = -1;
        }).observe(modalOverlay, { attributes: true, attributeFilter: ['class'] });
    })();

    async function loadSavedFeed() {
        const loadingEl = document.getElementById('feed-loading');
        if (typeof window.listMySavedPhotoKeys !== 'function') { renderFeedGrid([], 'No saved posts yet.'); return; }
        loadingEl.classList.remove('hidden');
        try {
            const savedKeys = await withTimeout(window.listMySavedPhotoKeys(), 15000);
            const savedSet = new Set(savedKeys);
            const savedPhotos = feedPhotos.filter(p => savedSet.has(p.uid + '_' + p.id));
            loadingEl.classList.add('hidden');
            renderFeedGrid(savedPhotos, 'No saved posts yet — tap the bookmark icon on a post to save it here.');
        } catch (e) {
            console.warn('Chargement des publications enregistrées échoué :', e);
            loadingEl.classList.add('hidden');
            renderFeedGrid([], 'No saved posts yet.');
        }
    }

    // Reflète immédiatement un enregistrement/retrait fait depuis la modale (voir
    // openLocModal() dans script.js) si l'onglet Saved est celui actuellement affiché —
    // sans ça, une publication retirée y resterait visible jusqu'au prochain changement
    // d'onglet.
    window.onPhotoSaveToggled = function () {
        if (currentFeedTab === 'saved') loadSavedFeed();
    };

    // Suggestions de comptes (demande du 10/09/2026) : recherche "contient" (comme
    // friends.html, ajout d'ami), pour retrouver un pseudo tapé au milieu — pas
    // seulement en préfixe. Cliquer une suggestion ouvre le profil public de ce compte.
    let userSuggestDebounce = null;
    const suggestBox = document.getElementById('feed-user-suggestions');
    function openUserSuggestion(username) {
        window.location.href = 'profile.html?u=' + encodeURIComponent(username);
    }
    document.getElementById('feed-search-input').addEventListener('input', (e) => {
        clearTimeout(userSuggestDebounce);
        const q = e.target.value.trim();
        if (!q || typeof window.searchUsernamesContaining !== 'function') {
            suggestBox.classList.add('hidden');
            suggestBox.innerHTML = '';
            return;
        }
        userSuggestDebounce = setTimeout(async () => {
            const matches = await window.searchUsernamesContaining(q, 6);
            if (document.getElementById('feed-search-input').value.trim() !== q) return;
            if (!matches.length) { suggestBox.classList.add('hidden'); suggestBox.innerHTML = ''; return; }
            suggestBox.innerHTML = matches.map(m => `
                <div class="feed-user-suggestion-row" data-username="${escapeHtml(m.username)}">
                    <div class="feed-user-suggestion-avatar" style="background:${feedAvatarColor(m.username)};">${escapeHtml((m.username || 'U').charAt(0).toUpperCase())}</div>
                    <span class="feed-user-suggestion-name">${escapeHtml(m.username)}</span>
                </div>
            `).join('');
            suggestBox.querySelectorAll('.feed-user-suggestion-row').forEach(row => {
                row.addEventListener('click', () => openUserSuggestion(row.dataset.username));
            });
            suggestBox.classList.remove('hidden');
        }, 250);
    });
    document.getElementById('feed-search-input').addEventListener('blur', () => {
        setTimeout(() => suggestBox.classList.add('hidden'), 150);
    });
    document.getElementById('feed-search-input').addEventListener('focus', (e) => {
        if (suggestBox.innerHTML.trim()) suggestBox.classList.remove('hidden');
    });

    async function loadFeed() {
        const loadingEl = document.getElementById('feed-loading');
        const emptyEl = document.getElementById('feed-empty');
        // Réinitialise l'état visuel à chaque appel, y compris un nouvel essai déclenché
        // par switchFeedTab() ci-dessus (demande du 20/09/2026) — sans ça, un essai après
        // un échec repartirait avec #feed-loading déjà masqué et le message d'erreur
        // toujours affiché jusqu'à la fin de CE nouvel appel.
        communityLoadFailed = false;
        loadingEl.classList.remove('hidden');
        emptyEl.classList.add('hidden');
        try {
            if (typeof window.fetchGlobalPhotoFeed !== 'function') throw new Error('fetchGlobalPhotoFeed unavailable');
            feedPhotos = await withTimeout(window.fetchGlobalPhotoFeed(), 15000);
            // Groupe/artiste (pour la recherche ci-dessus) : pas renvoyé par
            // fetchGlobalPhotoFeed (firebase-init.js, module Firebase pur, n'a pas accès à
            // celebLocations, chargée par script.js) — enrichi ici plutôt.
            if (typeof celebLocations !== 'undefined') {
                feedPhotos.forEach(p => {
                    const loc = celebLocations.find(l => l.id === p.locationId || l.id === Number(p.locationId));
                    p.group = loc ? loc.group : '';
                });
            }
            // Ne dessine la grille Community que si cet onglet est TOUJOURS actif (demande
            // du 14/09/2026, ajout de "sacred") : cette lecture Firestore est asynchrone et
            // peut résoudre après que la personne a déjà changé d'onglet (en particulier
            // "sacred", restauré immédiatement au chargement par restoreSacredReturnState()
            // ci-dessous, donc souvent avant même que cette requête ait fini) — sans cette
            // garde, la grille Community réapparaîtrait par-dessus en silence.
            if (currentFeedTab !== 'community') { loadingEl.classList.add('hidden'); return; }
            loadingEl.classList.add('hidden');
            if (!feedPhotos.length) { document.getElementById('feed-empty').textContent = 'No public photos yet.'; document.getElementById('feed-empty').classList.remove('hidden'); return; }
            renderFeedGrid(feedPhotos);
        } catch (e) {
            console.warn('Chargement du fil de photos échoué :', e);
            communityLoadFailed = true;
            loadingEl.classList.add('hidden');
            if (currentFeedTab === 'community') {
                emptyEl.textContent = 'Loading failed — check your connection and try again.';
                emptyEl.classList.remove('hidden');
            }
        }
    }

    // Ouvre la modale "publication" partagée (voir #loc-modal ci-dessus et
    // window.openLocModal() dans script.js) — demande du 10/09/2026 : remplace l'ancien
    // #feed-post-overlay propre à cette page par la même popup que profile.html. Ne fait
    // rien si p.locationId ne correspond à aucun lieu connu (même garde qu'ailleurs sur
    // le site, voir openLocModal()).
    function openFeedPost(index) {
        const p = feedPhotos[index];
        if (!p || typeof window.openLocModal !== 'function') return;
        window.openLocModal(p.locationId, {
            username: p.username,
            uid: p.uid,
            avatarColor: feedAvatarColor(p.username),
            photo: p.photo,
            caption: p.caption,
            photoKey: p.uid + '_' + p.id,
            photoId: p.standalone ? p.id : null
        });
    }

    // Filet de sécurité supplémentaire (demande du 19/09/2026, "problème de serveur sur
    // mobile, je n'arrive pas à voir les publications de feed... ça charge à l'infini") —
    // withTimeout() ci-dessus protège contre une requête Firestore qui ne répond jamais
    // une fois loadFeed() lancé, mais pas contre le cas où loadFeed() n'est JAMAIS appelé
    // du tout : "firebase-ready" n'est déclenché que depuis onAuthStateChanged(), dans
    // firebase-init.js — un <script type="module"> qui importe le SDK Firebase depuis
    // gstatic.com. Sur un réseau mobile lent/instable, ou un navigateur mobile qui bloque
    // ce module (navigation privée sans IndexedDB, etc.), cet import peut ne jamais
    // aboutir : "firebase-ready" ne part alors jamais, et #feed-loading (affiché par
    // défaut dans le HTML) reste visible indéfiniment sans qu'aucun code n'ait jamais
    // tourné pour le cacher — exactement le symptôme rapporté, absent sur desktop où cet
    // import échoue beaucoup plus rarement. Après 8s sans "firebase-ready", on charge le
    // fil quand même : window.fetchGlobalPhotoFeed() (si le module a fini par charger)
    // répond sans avoir besoin d'être connecté (lecture publique, voir firestore.rules),
    // et si la fonction est toujours indisponible, loadFeed() bascule proprement sur son
    // message "Loading failed" existant — un échec visible et actionnable, jamais un
    // spinner bloqué pour toujours.
    let feedLoadStarted = false;
    window.addEventListener('firebase-ready', () => {
        if (feedLoadStarted) return;
        feedLoadStarted = true;
        loadFeed();
    });
    setTimeout(() => {
        if (feedLoadStarted) return;
        feedLoadStarted = true;
        console.warn('"firebase-ready" jamais reçu après 8s — chargement du fil sans attendre Firebase.');
        loadFeed();
    }, 8000);
</script>
</body>
</html>
